<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Achievements — Carsel Club</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="app-shell">

    <!-- HEADER -->
    <header class="subscreen-header">
      <button class="back-btn" onclick="window.location.href='profile.html'" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h2 class="subscreen-title">Achievements</h2>
      <button class="menu-btn" onclick="showToast('Share achievements card...')" aria-label="Share">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
      </button>
    </header>

    <!-- CONTENT -->
    <main class="app-content subscreen">

      <!-- HERO -->
      <section class="ach-hero">
        <div class="ach-hero-emoji">🏆</div>
        <div class="ach-hero-title">Achievements</div>
        <div class="ach-hero-sub">3 dari 18 badge unlocked · Lanjut main untuk dapat lebih banyak!</div>
        <div class="ach-hero-progress-bar">
          <div class="ach-hero-progress-fill" style="width: 17%"></div>
        </div>
        <div class="ach-hero-stats">
          <span>🥇 3 unlocked</span>
          <span>⏳ 4 in progress</span>
          <span>🔒 11 locked</span>
        </div>
      </section>

      <!-- FEATURED RECENT -->
      <section>
        <div class="section-head">
          <h3>✨ Recently Unlocked</h3>
        </div>
        <div class="featured-ach">
          <div class="ach-icon">🔥</div>
          <div class="featured-ach-info">
            <div class="featured-ach-label">Earned Apr 18, 2026</div>
            <div class="featured-ach-name">5 Win Streak</div>
            <div class="featured-ach-meta">5 kemenangan beruntun · Lanjutin terus!</div>
          </div>
        </div>
      </section>

      <!-- FILTER TABS -->
      <section class="list-tabs">
        <button class="list-tab active" data-tab="all" onclick="filterAch('all')">
          <span>Semua</span>
          <span class="tab-count">18</span>
        </button>
        <button class="list-tab" data-tab="unlocked" onclick="filterAch('unlocked')">
          <span>🥇 Unlocked</span>
          <span class="tab-count">3</span>
        </button>
        <button class="list-tab" data-tab="progress" onclick="filterAch('progress')">
          <span>⏳ In Progress</span>
          <span class="tab-count">4</span>
        </button>
        <button class="list-tab" data-tab="locked" onclick="filterAch('locked')">
          <span>🔒 Locked</span>
          <span class="tab-count">11</span>
        </button>
      </section>

      <!-- ACHIEVEMENTS LIST -->
      <div id="achList">
        <!-- Rendered via JS -->
      </div>

    </main>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

  </div>

  <script>
    const achievements = [
      // Wins
      { cat: 'wins', emoji: '🏆', name: 'First Win', desc: 'Menang match pertamamu', status: 'unlocked', date: 'Earned Jan 12, 2026' },
      { cat: 'wins', emoji: '⭐', name: '10 Wins Club', desc: 'Total 10 kemenangan match', status: 'unlocked', date: 'Earned Feb 8, 2026' },
      { cat: 'wins', emoji: '💯', name: '100 Wins', desc: 'Total 100 kemenangan', status: 'progress', progress: 27, target: 100, hint: '73 wins lagi' },
      { cat: 'wins', emoji: '🌟', name: '500 Wins Legend', desc: 'Total 500 kemenangan match', status: 'locked', hint: 'Far target' },

      // Streaks
      { cat: 'streaks', emoji: '🔥', name: '5 Win Streak', desc: '5 kemenangan beruntun', status: 'unlocked', date: 'Earned Apr 18, 2026' },
      { cat: 'streaks', emoji: '⚡', name: '10 Win Streak', desc: '10 kemenangan beruntun · Sangat sulit!', status: 'locked', hint: 'Best streak: 5W' },

      // Match Volume
      { cat: 'volume', emoji: '🎾', name: '10 Matches', desc: 'Main 10 match', status: 'unlocked', date: 'Earned Jan 28, 2026' },
      { cat: 'volume', emoji: '🎯', name: '50 Matches', desc: 'Main 50 match', status: 'progress', progress: 47, target: 50, hint: '3 match lagi' },
      { cat: 'volume', emoji: '💪', name: '250 Matches', desc: 'Main 250 match', status: 'locked', hint: '203 match lagi' },
      { cat: 'volume', emoji: '🏟️', name: '1000 Matches', desc: 'Main 1,000 match · Veteran status', status: 'locked', hint: 'Far target' },

      // Tier
      { cat: 'tier', emoji: '🥈', name: 'Tier Up: Intermediate', desc: 'Naik ke tier Intermediate', status: 'unlocked', date: 'Earned Mar 4, 2026' },
      { cat: 'tier', emoji: '🏅', name: 'Tier Up: Advanced', desc: 'Naik ke tier Advanced', status: 'progress', progress: 740, target: 1000, hint: '260 pts + 53 match lagi' },
      { cat: 'tier', emoji: '👑', name: 'Tier Up: Pro', desc: 'Naik ke tier Pro', status: 'locked', hint: 'Need 3,000 pts + 250 match' },
      { cat: 'tier', emoji: '🏆', name: 'Tier Up: Master', desc: 'Naik ke tier Master · Top elite', status: 'locked', hint: 'Need 15,000 pts + 1,000 match' },

      // Social / Host
      { cat: 'social', emoji: '🎤', name: 'First Host', desc: 'Hosting session pertamamu', status: 'progress', progress: 8, target: 1, hint: '✨ Already done — meta achievement' },
      { cat: 'social', emoji: '👑', name: 'Top Host: 10 Sessions', desc: 'Hosting 10 sessions', status: 'progress', progress: 8, target: 10, hint: '2 session lagi' },
      { cat: 'social', emoji: '🤝', name: '10 Friends', desc: 'Punya 10 friends di Carsel Club', status: 'progress', progress: 12, target: 10, hint: '✓ Already done' },
      { cat: 'social', emoji: '🚀', name: 'Refer 5 Friends', desc: 'Ajak 5 teman join via referral link', status: 'locked', hint: '0 referrals so far' },

      // Tournament (v1.5+)
      { cat: 'tournament', emoji: '🏟️', name: 'Tournament Champion', desc: 'Juara 1 tournament', status: 'locked', hint: 'Tournament tersedia di v1.5' },
      { cat: 'tournament', emoji: '🥉', name: 'Tournament Top 3', desc: 'Top 3 di tournament', status: 'locked', hint: 'Tournament tersedia di v1.5' },

      // Special
      { cat: 'special', emoji: '✨', name: 'Welcome to Carsel Club', desc: 'Sign up via WhatsApp', status: 'unlocked', date: 'Earned Jan 5, 2026' },
      { cat: 'special', emoji: '🌅', name: 'Beta Tester', desc: 'Active sebagai user di closed beta', status: 'unlocked', date: 'Earned Jan 5, 2026' }
    ];

    const categories = {
      wins: { emoji: '🏆', label: 'Wins' },
      streaks: { emoji: '🔥', label: 'Streaks' },
      volume: { emoji: '🎾', label: 'Match Volume' },
      tier: { emoji: '🥈', label: 'Tier Journey' },
      social: { emoji: '🤝', label: 'Social & Host' },
      tournament: { emoji: '🏟️', label: 'Tournament' },
      special: { emoji: '✨', label: 'Special' }
    };

    let currentFilter = 'all';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._tt);
      window._tt = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function filterAch(filter) {
      currentFilter = filter;
      document.querySelectorAll('.list-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.list-tab[data-tab="${filter}"]`).classList.add('active');
      render();
    }

    function getStatusLabel(a) {
      if (a.status === 'unlocked') {
        return `<span class="ach-earned-date">✓ ${a.date}</span>`;
      }
      if (a.status === 'progress') {
        const pct = Math.min(Math.round((a.progress / a.target) * 100), 100);
        return `
          <div class="ach-progress">
            <div class="ach-progress-bar">
              <div class="ach-progress-fill" style="width:${pct}%"></div>
            </div>
            <div class="ach-progress-text">${a.progress}/${a.target}</div>
          </div>
        `;
      }
      return `<span class="ach-locked-text">🔒 ${a.hint}</span>`;
    }

    function renderAch(a) {
      const lockOverlay = a.status === 'locked' ? `
        <div class="ach-icon-lock">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
      ` : '';

      return `
        <div class="ach-card ${a.status}" onclick="showAchDetail('${a.name.replace(/'/g, "\\'")}','${a.status}')">
          <div class="ach-icon">
            ${a.emoji}
            ${lockOverlay}
          </div>
          <div class="ach-info">
            <div class="ach-name">${a.name}</div>
            <div class="ach-desc">${a.desc}</div>
            ${getStatusLabel(a)}
          </div>
        </div>
      `;
    }

    function showAchDetail(name, status) {
      if (status === 'unlocked') showToast(`🏆 ${name} — Klik Share untuk bagikan ke WA/IG`);
      else if (status === 'progress') showToast(`⏳ ${name} — Lanjutkan progress kamu!`);
      else showToast(`🔒 ${name} — Belum tersedia / butuh requirement`);
    }

    function render() {
      let filtered = achievements;
      if (currentFilter !== 'all') {
        if (currentFilter === 'progress') {
          filtered = achievements.filter(a => a.status === 'progress');
        } else {
          filtered = achievements.filter(a => a.status === currentFilter);
        }
      }

      // Group by category
      const grouped = {};
      filtered.forEach(a => {
        if (!grouped[a.cat]) grouped[a.cat] = [];
        grouped[a.cat].push(a);
      });

      let html = '';
      Object.entries(grouped).forEach(([cat, items]) => {
        const meta = categories[cat];
        const unlockedCount = items.filter(a => a.status === 'unlocked').length;
        html += `
          <div class="ach-category-head">
            <div class="ach-cat-title">
              <span class="ach-cat-emoji">${meta.emoji}</span>
              <span>${meta.label}</span>
            </div>
            <span class="ach-cat-count">${unlockedCount}/${items.length}</span>
          </div>
          <div class="ach-list">${items.map(renderAch).join('')}</div>
        `;
      });

      if (filtered.length === 0) {
        html = `<div class="empty-hero" style="margin-top:var(--s-3);">
          <div class="empty-illustration" style="width:80px; height:80px; font-size:36px;">🏆</div>
          <div class="empty-title" style="font-size:16px;">Tidak ada achievement di filter ini</div>
          <div class="empty-desc" style="font-size:13px;">Coba ganti filter untuk lihat achievement lain.</div>
        </div>`;
      }

      document.getElementById('achList').innerHTML = html;
    }

    render();
  </script>
</body>
</html>
