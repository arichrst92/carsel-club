<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Match List — Carsel Club</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="app-shell">

    <!-- HEADER -->
    <header class="subscreen-header">
      <button class="back-btn" onclick="window.location.href='session-detail.html'" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h2 class="subscreen-title">Match Round Set #1</h2>
      <button class="menu-btn" onclick="showToast('Menu: View leaderboard, Share, Edit round set')" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </header>

    <!-- CONTENT -->
    <main class="app-content subscreen with-footer" id="mainContent">

      <!-- ROUND SET HERO -->
      <section class="round-set-hero">
        <div class="rs-title">Round Set #1 · Sabtu Sore Padel</div>
        <div class="rs-meta">⚡ Auto · 7 round · 8 pemain · 2 court</div>
        <div class="rs-progress-bar">
          <div class="rs-progress-fill" id="progressFill" style="width: 21%"></div>
        </div>
        <div class="rs-progress-text">
          <span id="progressText">3 dari 14 match selesai</span>
          <span id="progressPercent">21%</span>
        </div>
      </section>

      <!-- LEADERBOARD QUICK LINK -->
      <section>
        <a href="session-leaderboard.html" style="display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--bg); border:1px solid var(--border-light); border-radius:var(--r-lg); text-decoration:none; color:inherit; transition:all 0.15s;">
          <div style="width:36px; height:36px; border-radius:var(--r-md); background:linear-gradient(135deg, #FACC15, #FB7185); display:grid; place-items:center; flex-shrink:0;">
            <span style="font-size:18px;">🏆</span>
          </div>
          <div style="flex:1;">
            <div style="font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--text-900);">Live Leaderboard</div>
            <div style="font-size:12px; color:var(--text-500); font-weight:600;">Lihat ranking saat ini</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-400);"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </section>

      <!-- ROUNDS -->
      <div id="roundsContainer">
        <!-- Rendered via JS -->
      </div>

    </main>

    <!-- STICKY FOOTER -->
    <div class="sticky-footer dual" id="footerActions">
      <button class="btn-secondary-lg" onclick="window.location.href='session-leaderboard.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5A2.5 2.5 0 0 1 2 6.5V6h4M18 9h1.5A2.5 2.5 0 0 0 22 6.5V6h-4"/><path d="M6 22h12M9 22V12.5M15 22V12.5"/><path d="M6 6V2h12v8a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V6z"/></svg>
        <span>Leaderboard</span>
      </button>
      <button class="btn-primary-lg" onclick="generateExtra()" id="primaryAction">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="primaryActionText">Generate Extra Match</span>
      </button>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

  </div>

  <script>
    // Mock data: 7 rounds × 2 courts = 14 matches
    const matches = [
      // Round 1 — both done
      { round: 1, court: 1, t1: 'Ari · Dimas', t2: 'Maya · Rizki', s1: 21, s2: 18, status: 'done' },
      { round: 1, court: 2, t1: 'Budi · Sari', t2: 'Rio · Pak Eko', s1: 19, s2: 21, status: 'done' },
      // Round 2 — Court 1 live, Court 2 pending
      { round: 2, court: 1, t1: 'Ari · Rio', t2: 'Dimas · Maya', s1: 14, s2: 11, status: 'live', time: '5 min' },
      { round: 2, court: 2, t1: 'Sari · Rizki', t2: 'Budi · Pak Eko', s1: 0, s2: 0, status: 'pending' },
      // Round 3 — both pending
      { round: 3, court: 1, t1: 'Ari · Sari', t2: 'Maya · Budi', s1: 0, s2: 0, status: 'pending' },
      { round: 3, court: 2, t1: 'Dimas · Pak Eko', t2: 'Rizki · Rio', s1: 0, s2: 0, status: 'pending' },
      // Round 4 — both pending
      { round: 4, court: 1, t1: 'Ari · Budi', t2: 'Rio · Sari', s1: 0, s2: 0, status: 'pending' },
      { round: 4, court: 2, t1: 'Dimas · Rizki', t2: 'Maya · Pak Eko', s1: 0, s2: 0, status: 'pending' },
      // Round 5
      { round: 5, court: 1, t1: 'Ari · Maya', t2: 'Rizki · Pak Eko', s1: 0, s2: 0, status: 'pending' },
      { round: 5, court: 2, t1: 'Dimas · Sari', t2: 'Budi · Rio', s1: 0, s2: 0, status: 'pending' },
      // Round 6
      { round: 6, court: 1, t1: 'Ari · Pak Eko', t2: 'Sari · Budi', s1: 0, s2: 0, status: 'pending' },
      { round: 6, court: 2, t1: 'Maya · Rio', t2: 'Dimas · Rizki', s1: 0, s2: 0, status: 'pending' },
      // Round 7
      { round: 7, court: 1, t1: 'Ari · Rizki', t2: 'Pak Eko · Maya', s1: 0, s2: 0, status: 'pending' },
      { round: 7, court: 2, t1: 'Dimas · Budi', t2: 'Rio · Sari', s1: 0, s2: 0, status: 'pending' }
    ];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._tt);
      window._tt = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function statusPill(m) {
      if (m.status === 'done') {
        const winner = m.s1 > m.s2 ? 'team1' : 'team2';
        return `<span class="mc-action-pill done">✓ Final</span>`;
      }
      if (m.status === 'live') {
        return `<span class="mc-action-pill live">▶ LIVE</span>`;
      }
      return `<span class="mc-action-pill">▶ Start</span>`;
    }

    function statusText(m) {
      if (m.status === 'done') {
        const winner = m.s1 > m.s2 ? m.t1 : m.t2;
        return `<span class="mc-status-text">🏆 ${winner} menang</span>`;
      }
      if (m.status === 'live') {
        return `<span class="mc-status-text live"><span class="live-dot"></span>LIVE · ${m.time}</span>`;
      }
      return `<span class="mc-status-text">⏳ Belum mulai</span>`;
    }

    function renderMatch(m) {
      const winnerT1 = m.status === 'done' && m.s1 > m.s2 ? 'winner' : '';
      const winnerT2 = m.status === 'done' && m.s2 > m.s1 ? 'winner' : '';
      const showScore = m.status !== 'pending';

      return `
        <a href="match-scoring.html?status=${m.status}&round=${m.round}&court=${m.court}" class="match-card ${m.status}">
          <div class="mc-court-badge">
            <div class="mc-court-label">Court</div>
            <div class="mc-court-num">${m.court}</div>
          </div>
          <div class="mc-info">
            <div class="mc-teams">
              <div class="mc-team-row ${winnerT1}">
                <div class="mc-team-names">${m.t1}</div>
                ${showScore ? `<div class="mc-team-score">${m.s1}</div>` : ''}
              </div>
              <div class="mc-vs">vs</div>
              <div class="mc-team-row ${winnerT2}">
                <div class="mc-team-names">${m.t2}</div>
                ${showScore ? `<div class="mc-team-score">${m.s2}</div>` : ''}
              </div>
            </div>
            <div class="mc-status">
              ${statusText(m)}
              ${statusPill(m)}
            </div>
          </div>
        </a>
      `;
    }

    function renderRoundGroup(roundNum) {
      const roundMatches = matches.filter(m => m.round === roundNum);
      const doneCount = roundMatches.filter(m => m.status === 'done').length;
      const liveCount = roundMatches.filter(m => m.status === 'live').length;
      const total = roundMatches.length;

      let groupStatus = 'pending';
      let groupStatusLabel = '';
      if (doneCount === total) {
        groupStatus = 'done';
        groupStatusLabel = '<span class="round-group-status done">✓ Done</span>';
      } else if (liveCount > 0 || doneCount > 0) {
        groupStatus = 'live';
        groupStatusLabel = '<span class="round-group-status live">In Progress</span>';
      } else {
        groupStatusLabel = '<span class="round-group-status pending">Pending</span>';
      }

      return `
        <div class="round-group">
          <div class="round-group-header">
            <div class="round-group-title">
              <span>Round ${roundNum}</span>
              ${groupStatusLabel}
            </div>
            <div class="round-group-progress">${doneCount} / ${total} done</div>
          </div>
          ${roundMatches.map(renderMatch).join('')}
        </div>
      `;
    }

    function render() {
      const container = document.getElementById('roundsContainer');
      const rounds = [...new Set(matches.map(m => m.round))].sort((a,b) => a - b);
      container.innerHTML = rounds.map(renderRoundGroup).join('');

      // Update progress
      const total = matches.length;
      const done = matches.filter(m => m.status === 'done').length;
      const pct = Math.round((done / total) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = `${done} dari ${total} match selesai`;
      document.getElementById('progressPercent').textContent = pct + '%';

      // Update primary action based on completion
      const primaryText = document.getElementById('primaryActionText');
      if (done === total) {
        primaryText.textContent = 'Generate Extra Match';
      } else {
        primaryText.textContent = 'Generate Extra Match';
      }
    }

    function generateExtra() {
      window.location.href = 'generate-match.html';
    }

    render();
  </script>
</body>
</html>
